name: Post-main verification

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - name: Run authoritative verification
        run: ./ci/measure.sh ci-artifacts
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-main-evidence
          path: ci-artifacts
